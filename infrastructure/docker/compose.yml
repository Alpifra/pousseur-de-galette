name: pousseur-de-galette

x-php: &php
    build:
        context: .
        dockerfile: ./php/php.dockerfile
    depends_on:
        - database
    restart: unless-stopped
    volumes:
        - var:/srv/app/var
        - ./php/conf.d/php.ini:/usr/local/etc/php/conf.d/php.ini
        - ./php/conf.d/symfony.dev.ini:/usr/local/etc/php/conf.d/symfony.ini
        - ../../api:/srv/app:rw,cached
    environment:
        APP_ENV: dev
        DATABASE_URL: mysql://${MARIADB_USER:-galette}:${MARIADB_PASSWORD:-password}@database:3306/${MARIADB_DATABASE:-galette}?serverVersion=${MARIADB_VERSION:-10.6}.0-MariaDB&charset=utf8mb4
        MERCURE_URL: http://mercure/.well-known/mercure
        # Relative: the same hub works whether the page was opened on the loopback or on the LAN IP
        MERCURE_PUBLIC_URL: /.well-known/mercure
        MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
        MERCURE_JWT_ISSUER: https://${SERVER_NAME:-127.0.0.1}
        MERCURE_JWT_AUDIENCE: https://${SERVER_NAME:-127.0.0.1}

services:

    caddy:
        image: caddy:2-alpine
        depends_on:
            - php
            - front
            - mercure
        environment:
            SERVER_NAME: ${SERVER_NAME:-127.0.0.1}
        restart: unless-stopped
        volumes:
            - caddy_data:/data
            - caddy_config:/config
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - ../../api/public:/srv/app/public:ro
        # The public URLs carry no port: publishing other ones means adding them back to every origin above
        ports:
            - target: 80
              published: ${HTTP_PORT:-80}
              protocol: tcp
            - target: 443
              published: ${HTTPS_PORT:-443}
              protocol: tcp
            - target: 443
              published: ${HTTPS_PORT:-443}
              protocol: udp

    php: *php

    worker:
        <<: *php
        command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv

    playback:
        <<: *php
        command: php bin/console app:playback:run -v

    mercure:
        image: dunglas/mercure
        restart: unless-stopped
        environment:
            SERVER_NAME: ':80'
            MERCURE_TRUSTED_ISSUERS: https://${SERVER_NAME:-127.0.0.1}
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
            MERCURE_EXTRA_DIRECTIVES: |-
                resource_identifier https://${SERVER_NAME:-127.0.0.1}
                anonymous
                cors_origins https://${SERVER_NAME:-127.0.0.1}
        volumes:
            - mercure_data:/data
            - mercure_config:/config

    database:
        # Same major version as the Infomaniak production server
        image: mariadb:${MARIADB_VERSION:-10.6}
        restart: unless-stopped
        environment:
            MARIADB_DATABASE: ${MARIADB_DATABASE:-galette}
            MARIADB_USER: ${MARIADB_USER:-galette}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD:-password}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
        volumes:
            - mariadb_data:/var/lib/mysql
            - ./db/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "${MARIADB_PORT:-3307}:3306"

    front:
        image: node:24-alpine
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        environment:
            VITE_HMR_CLIENT_PORT: ${HTTPS_PORT:-443}
        restart: unless-stopped
        volumes:
            - ../../front:/app:rw,cached
            - front_node_modules:/app/node_modules

volumes:
    var:
    caddy_data:
    caddy_config:
    mercure_data:
    mercure_config:
    mariadb_data:
    front_node_modules:
